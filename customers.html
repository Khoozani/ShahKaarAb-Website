       @media (orientation: Portrait) {
			 			 
                 #warning-message {

				 #cust {	 
			 display:none;
		
		 }	
			  }
		 
		 @media (orientation: landscape) {
			   #warning-message { display:none; }

			 visibility:visible;
		 }	
		 
			 
		 #Looster {
			 position:absolute;
			 left: -100%;
             top: -10%;
			 width: 40%;
			 visibility:visible; 
		 
		 	 
			 animation-name: Looster;
             animation-duration: 10s;
             animation-direction:normal;
			 
                        	            	 }
		 
          @keyframes Looster {
    
			  0%   { left:400%; top: -10%;  }
			  25%  { left:50%; top:-10%;}			   
			  50%  { left:50%; top:-10%;}
			  100% { left:-100%; top:-10%;}
		 
	                                      	 }
			 #Customers_BG {
			 position:absolute;
			 left: -20%;
             top: 0%;
			 transform: rotate(0deg);
			 width: 120% ;
			  
			  
		     animation-name: Customers_BG;
             animation-duration: 16s;
             animation-direction:normal;
			 
                        	            	 }
		 
          @keyframes Customers_BG {
    
			  0%   { left:0%; top:0%; transform: rotate(0deg);}
			  100% { left:-20%; top:0%; transform: rotate(0deg);}
		 }
		 
	  	#Customers_P1 {
			 position:absolute;
			 left: 5%;
             top: 5%;
			width: 90%;
			 visibility:visible; 
		 
		 	 
			 animation-name: Customers_P1;
             animation-duration: 10s;
             animation-direction:normal;
			 
                        	            	 }
		 
          @keyframes Customers_P1 {
    
			  0%   { left:150%; top:5%;  }
			  25%  { left:5%; top:5%;}			   
			  50%  { left:5%; top:5%;}
			  100% { left:5%; top:5%;}
		 
	                                      	 }
		 
		  #Home {
			 position:absolute;
			 left: 87%;
             top: 80%;
			 visibility:visible;
			   cursor: pointer;
		 
		 	 
			 animation-name: Home;
             animation-duration: 13s;
             animation-direction:normal;
			 
                        	            	 }
		 
          @keyframes Home {
    
			  0%   { left:150%;; top:80%;  }
			  25%  { left:90%; top:80%;}			   
			  50%  { left:90%; top:80%;}
			  100% { left:87%; top:80%;}
		 
	                                      	 }
