<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game UI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="screen">

        <div class="game-area">


            <!-- =====================================
                 MAIN IMAGE
            ====================================== -->

            <img
                class="main-image"
                src="Index/Box_Small.png"
                alt="Main Image"
            >
			
	     <!-- =====================================
                 MOVING IMAGE 3
           

           <img
                class="moving-image moving-image-3"
                src="Index/IndependentGameAuteur_Small.png"

                data-start-x="20"
                data-start-y="39"

                data-end-x="20"
                data-end-y="40"

                data-mode="pingpong"
                data-speed="70"

                alt="Moving Image 1"
            >
			 ====================================== -->
			  

            <!-- =====================================
                 MOVING IMAGE 2
            ====================================== -->
           <img
                class="moving-image moving-image-2"
                src="Index/Cardboard_IGA&S.png"

                data-start-x="50"
                data-start-y="48"

                data-end-x="50"
                data-end-y="55"

                data-mode="pingpong"
                data-speed="20"

                alt="Moving Image 2"
            >
       
	
	 <!-- =====================================
                 MOVING IMAGE 4
            

           <img
                class="moving-image moving-image-4"
                src="Index/Since2000_Small.png"

                data-start-x="14"
                data-start-y="60"

                data-end-x="14"
                data-end-y="66"

                data-mode="pingpong"
                data-speed="20"

                alt="Moving Image 1"
            >
           ====================================== -->
			
            <!-- =====================================
                 MOVING IMAGE 1
            ====================================== -->

           <img
                class="moving-image moving-image-1"
                src="Index/Logo/Logo.png"

                data-start-x="19"
                data-start-y="50"

                data-end-x="19"
                data-end-y="55"

                data-mode="pingpong"
                data-speed="50"

                alt="Moving Image 1"
            >
		

			 

            <!-- =====================================
                 BUTTON 1
                 Hover Image + Link
            ====================================== -->

            <a
                class="button button-1"
                href="Home/Home_En.html"
            >

                <img
                    src="Index/Buttons/A_Up.png"
                    data-normal="Index/Buttons/A_Up.png"
                    data-hover="Index/Buttons/A_Down.png"
                    alt="Button 1"
                >

            </a>


            <!-- =====================================
                 BUTTON 2
                 Normal Image + Link
            ====================================== -->

            <a
                class="button button-2"
                href="Home/Home_En.html"
            >

                <img
                    src="Index/Languages/English.png"
                    alt="Button 2"
                >

            </a>


            <!-- =====================================
                 BUTTON 3
                 Hover Image + Link
            ====================================== -->

            <a
                class="button button-3"
                href="Home/Home_Fa.html"
            >

                <img
                    src="Index/Buttons/B_Up.png"
                    data-normal="Index/Buttons/B_Up.png"
                    data-hover="Index/Buttons/B_Down.png"
                    alt="Button 3"
                >

            </a>


            <!-- =====================================
                 BUTTON 4
                 Normal Image + Link
            ====================================== -->

            <a
                class="button button-4"
                href="Home/Home_Fa.html"
            >

                <img
                    src="Index/Languages/Persian.png"
                    alt="Button 4"
                >

            </a>


        </div>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>


</body>

</html>
